<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone screen</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #6b6b6b; --line: #d9d9d9;
    --bezel: #111111; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    color-scheme: light dark;
  }
  :root[data-theme="dark"] {
    --bg: #161616; --fg: #ededed; --muted: #9a9a9a; --line: #333333;
    --bezel: #000000; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --fg: #ededed; --muted: #9a9a9a; --line: #333333;
      --bezel: #000000; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; }
  #status { width: 100%; display: flex; align-items: center; gap: 6px; min-height: 18px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot[data-tone="ok"] { background: var(--ok); }
  #dot[data-tone="warn"] { background: var(--warn); }
  #dot[data-tone="bad"] { background: var(--bad); }
  #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #device { position: relative; background: var(--bezel); border-radius: 26px; padding: 8px;
    width: min(100%, 320px); }
  #screen { position: relative; border-radius: 19px; overflow: hidden; background: #000;
    aspect-ratio: 9 / 19.5; display: flex; align-items: center; justify-content: center; }
  #image { width: 100%; height: 100%; object-fit: contain; display: block; }
  #image[hidden] { display: none; }
  #empty { color: #bbbbbb; padding: 16px; text-align: center; }
  #empty[hidden] { display: none; }
  #toolbar { display: flex; gap: 8px; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: .45; cursor: default; }
  #note { color: var(--muted); min-height: 16px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="status"><span id="dot"></span><span id="status-text">connecting…</span></div>
  <div id="device"><div id="screen">
    <img id="image" alt="iPhone screen" hidden>
    <div id="empty">waiting for the first frame…</div>
  </div></div>
  <div id="toolbar">
    <button id="home" type="button" title="Go to the Home Screen">Home</button>
    <button id="refresh" type="button" title="Capture a fresh frame now">Refresh</button>
  </div>
  <div id="note"></div>
</div>
<script>
(() => {
  "use strict";
  // MCP Apps (SEP-1865) view: JSON-RPC 2.0 over postMessage with the host.
  const FRAME_TOOL = "__IU_FRAME_TOOL__";
  const VERSION = "__IU_VERSION__";
  const PROTOCOL = "2026-01-26";
  const FRAME_INTERVAL_MS = 500;   // at most 2 frames a second
  const IDLE_INTERVAL_MS = 2000;   // released / offline phone
  const REQUEST_TIMEOUT_MS = 8000;

  /* ── i18n: English is the source; Chinese follows the viewer's browser. ── */
  const I18N_ZH = {
    "iPhone screen": "iPhone 屏幕",
    "connecting…": "正在连接…",
    "waiting for the first frame…": "正在等待第一帧画面…",
    "Home": "主屏幕",
    "Go to the Home Screen": "回到主屏幕",
    "Refresh": "刷新",
    "Capture a fresh frame now": "立即截取新画面",
    "private": "画面已隐藏",
    "released": "已交还",
    "locked": "已锁屏",
    "drivable": "可操作",
    "not drivable": "不可操作",
    "owner {owner}": "使用者 {owner}",
    "owner {owner} (this session)": "使用者 {owner}（本会话）",
    "no owner": "无人使用",
    "Someone is signing in on the phone. The screen stays hidden until the agent continues.":
      "有人正在手机上登录。agent 继续之前，画面会一直隐藏。",
    "phone released — the agent reconnects it when needed": "手机已交还——agent 需要时会重新连接",
    "no frame yet": "暂无画面",
    "panel cannot reach iphone-use — {error}": "面板连不上 iphone-use — {error}",
    "Home failed": "回到主屏幕失败",
    "Home failed: {error}": "回到主屏幕失败：{error}",
    "sent Home": "已回到主屏幕",
    "this host did not answer ui/initialize": "宿主没有响应 ui/initialize",
    "frame tool failed": "截图工具出错",
    "empty frame": "没有收到画面",
  };
  const ZH = (() => {
    const first = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    return first.toLowerCase().startsWith("zh");
  })();
  document.documentElement.lang = ZH ? "zh-CN" : "en";
  /* t("owner {owner}", {owner}) — placeholders are {name}. */
  function t(en, vars) {
    let s = (ZH && Object.prototype.hasOwnProperty.call(I18N_ZH, en)) ? I18N_ZH[en] : en;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
    return s;
  }
  if (ZH) {
    document.title = t(document.title);
    for (const el of document.querySelectorAll("#status-text, #empty, button")) el.textContent = t(el.textContent);
    for (const el of document.querySelectorAll("[title], [alt]")) {
      if (el.title) el.title = t(el.title);
      if (el.alt) el.alt = t(el.alt);
    }
  }

  const $ = (id) => document.getElementById(id);
  const image = $("image"), empty = $("empty"), dot = $("dot");
  const statusText = $("status-text"), note = $("note");
  const homeButton = $("home"), refreshButton = $("refresh");

  let nextId = 1;
  const pending = new Map();
  let ready = false, disposed = false, inFlight = false, onScreen = true;
  let timer = null, failures = 0, noteTimer = null;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        pending.delete(id);
        reject(new Error(method + " timed out"));
      }, REQUEST_TIMEOUT_MS);
      pending.set(id, { resolve, reject, timeout });
    });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params: params || {} }); }

  function applyTheme(context) {
    const theme = context && context.theme;
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  }

  function dispose() {
    disposed = true;
    stop();
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && msg.method === undefined) {
      const waiter = pending.get(msg.id);
      if (!waiter) return;
      pending.delete(msg.id);
      clearTimeout(waiter.timeout);
      if (msg.error) waiter.reject(new Error(msg.error.message || "request failed"));
      else waiter.resolve(msg.result);
      return;
    }
    if (msg.id !== undefined) {
      // A request from the host.
      if (msg.method === "ui/resource-teardown") {
        dispose();
        send({ jsonrpc: "2.0", id: msg.id, result: {} });
      } else if (msg.method === "ping") {
        send({ jsonrpc: "2.0", id: msg.id, result: {} });
      } else {
        send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "method not found" } });
      }
      return;
    }
    if (msg.method === "ui/notifications/host-context-changed") applyTheme(msg.params);
    else if (msg.method === "ui/notifications/tool-result") kick(0);
  });

  function setStatus(tone, text) {
    dot.dataset.tone = tone;
    statusText.textContent = text;
    statusText.title = text;
  }
  function flash(text) {
    note.textContent = text;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { note.textContent = ""; }, 2500);
  }

  function describe(body) {
    const name = body.phone || body.model || "iPhone";
    const parts = [name];
    if (body.private_secs) parts.push(t("private"));
    else if (body.released) parts.push(t("released"));
    else if (body.locked) parts.push(t("locked"));
    else if (body.drivable === true) parts.push(t("drivable"));
    // The blocker code is for diagnosis; when a localized next step will
    // follow (see show), it says the same thing in words.
    else if (body.drivable === false) {
      const guided = body.next_step || body.next_step_zh;
      const detail = body.blocked_on && !guided ? body.blocked_on : !body.blocked_on ? body.state : "";
      parts.push(t("not drivable") + (detail ? " (" + detail + ")" : ""));
    }
    if (body.owner) parts.push(t(body.mine ? "owner {owner} (this session)" : "owner {owner}", { owner: body.owner }));
    else parts.push(t("no owner"));
    return parts.join(" · ");
  }

  function show(body) {
    if (!body || typeof body !== "object") throw new Error("empty frame");
    const tone = body.error && !body.frame ? "bad"
      : body.drivable === true ? "ok" : "warn";
    let text = describe(body);
    if (body.error && !body.frame) text += " — " + body.error;
    else if (body.drivable === false) {
      const step = (ZH && body.next_step_zh) || body.next_step || body.hint;
      if (step) text += " — " + step;
    }
    if (body.private_secs) {
      setStatus("warn", describe(body));
      image.hidden = true;
      image.removeAttribute("src");
      empty.textContent = t("Someone is signing in on the phone. The screen stays hidden until the agent continues.");
      empty.hidden = false;
      return false;
    }
    setStatus(tone, text);
    const frame = body.frame;
    if (frame && typeof frame.data === "string" && frame.data.length > 0
        && /^image\/(png|jpeg|webp)$/.test(frame.mime_type)) {
      image.src = "data:" + frame.mime_type + ";base64," + frame.data;
      image.hidden = false;
      empty.hidden = true;
    } else if (image.hidden) {
      empty.textContent = body.released ? t("phone released — the agent reconnects it when needed")
        : t("no frame yet");
      empty.hidden = false;
    }
    return !!frame && !body.released;
  }

  function visible() { return !disposed && onScreen && !document.hidden; }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  function kick(delay) {
    if (!visible() || timer) return;
    timer = setTimeout(() => { timer = null; poll(false); }, delay);
  }

  async function connect() {
    const result = await request("ui/initialize", {
      appInfo: { name: "iphone-use-screen", version: VERSION },
      appCapabilities: {},
      protocolVersion: PROTOCOL,
    });
    ready = true;
    applyTheme(result && result.hostContext);
    notify("ui/notifications/initialized");
    reportSize();
  }

  async function callTool(name, args) {
    if (!ready) await connect();
    return request("tools/call", { name, arguments: args || {} });
  }

  async function poll(fresh) {
    if (!visible() || inFlight) return;
    inFlight = true;
    const started = performance.now();
    let delay = FRAME_INTERVAL_MS;
    try {
      const result = await callTool(FRAME_TOOL, fresh ? { fresh: true } : {});
      if (result && result.isError) throw new Error("frame tool failed");
      const live = show(result && result.structuredContent);
      failures = 0;
      delay = live ? Math.max(0, FRAME_INTERVAL_MS - (performance.now() - started)) : IDLE_INTERVAL_MS;
    } catch (error) {
      failures += 1;
      delay = Math.min(5000, 1000 * failures);
      if (failures > 1) setStatus("bad", t("panel cannot reach iphone-use — {error}", { error: t(error.message) }));
    } finally {
      inFlight = false;
      kick(delay);
    }
  }

  async function home() {
    homeButton.disabled = true;
    try {
      const result = await callTool("phone_shortcut", { name: "home", observe: false });
      if (result && result.isError) {
        const text = (result.content || []).map((c) => c.text || "").join(" ").trim();
        flash(text ? t("Home failed: {error}", { error: text.slice(0, 160) }) : t("Home failed"));
      } else {
        flash(t("sent Home"));
      }
    } catch (error) {
      flash(t("Home failed: {error}", { error: error.message }));
    } finally {
      homeButton.disabled = false;
      stop();
      kick(0);
    }
  }

  async function refresh() {
    refreshButton.disabled = true;
    stop();
    try { await poll(true); } finally { refreshButton.disabled = false; }
  }

  homeButton.addEventListener("click", home);
  refreshButton.addEventListener("click", refresh);

  function visibilityChanged() { if (visible()) kick(0); else stop(); }
  document.addEventListener("visibilitychange", visibilityChanged);
  window.addEventListener("pagehide", () => { onScreen = false; stop(); });
  window.addEventListener("pageshow", () => { onScreen = true; visibilityChanged(); });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((entries) => {
      onScreen = entries.some((entry) => entry.isIntersecting);
      visibilityChanged();
    }).observe($("app"));
  }

  let lastHeight = 0;
  function reportSize() {
    if (!ready) return;
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (height === lastHeight) return;
    lastHeight = height;
    notify("ui/notifications/size-changed", { width: Math.ceil(window.innerWidth), height });
  }
  if ("ResizeObserver" in window) new ResizeObserver(reportSize).observe(document.body);

  connect().catch(() => setStatus("bad", t("this host did not answer ui/initialize")))
    .finally(() => kick(0));
})();
</script>
</body>
</html>
