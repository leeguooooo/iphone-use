[package]
name = "server"
version = "0.10.8"
edition = "2021"

# The daemon binary. Lib stays for unit-testable glue (http/signaling/webrtc
# decode helpers); the bin is the `iphone-use serve`/`stop` CLI entrypoint.
[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "iphone-use"
path = "src/main.rs"

[dependencies]
core = { path = "../core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
getrandom = "0.3"

# Daemon integration layer.
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# async runtime + HTTP server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
axum = "0.7"

# HTTP client for WDA and the release check. rustls-tls: no native-tls/openssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Stream combinators — attach a live-view drop guard to the proxied MJPEG
# stream so an open viewer counts as activity for the idle-release watchdog.
futures-util = "0.3"

# `iphone-use upgrade` downloads install.sh into a private temp dir before
# running it, so a failed download is reported instead of piped into `sh`.
tempfile = "3"

# WDA (L2 element-tree control): screenshots arrive base64-encoded.
base64 = "0.22"
sha2 = "0.10"

# Live video as H.264: WDA's MJPEG frames are decoded (zune-jpeg) and
# re-encoded on the Mac's hardware encoder (VideoToolbox), cutting a remote
# viewer's bandwidth ~10x versus forwarding the JPEGs.
zune-jpeg = "0.4"

# Scan-to-connect: the pairing page shows the one-time link as a QR code.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Screens an app hides from capture (PayPay): a blank screenshot is detected
# (png decode) and the accessibility tree is drawn over it (ab_glyph text).
png = "0.17"
ab_glyph = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
