[package]
name = "core"
version = "0.27.16"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
schemars = { version = "1", optional = true }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
getrandom = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
schema = ["dep:schemars"]
