name: iOS app

# The remote app's unit tests on a hosted Mac simulator. Nothing ran them
# before a merge; a Swift regression surfaced only when a user ran
# `iphone-use setup-app`. The Xcode project is generated (xcodegen,
# project.remote.yml), not committed, and the app links the Rust browser
# session library, so both are produced here first.
#
# Separate from pr-checks.yml because a `pull_request` trigger cannot carry
# both `paths-ignore` (there) and `paths` (here).
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'crates/browser-session/**'
      - 'scripts/build-browser-session.sh'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:

concurrency:
  group: >-
    ios-app-${{ github.event.pull_request.number
      || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Remote app unit tests (simulator)
    # The app is written against the current Swift concurrency rules and does
    # not compile with Xcode 16.2 (main-actor isolation errors in
    # DeviceSession.swift / LocalControlAcceptance.swift), so this job uses the
    # newest hosted image and whatever Xcode it ships, unlike the other macOS
    # jobs which pin Xcode 16.2.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (iOS simulator target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ios-app-browser-session
          # build-browser-session.sh builds into its own target directory.
          workspaces: |
            . -> target-browser-session
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the browser session library for the simulator
        run: bash scripts/build-browser-session.sh simulator

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          set -euo pipefail
          brew install xcodegen >/dev/null
          xcodegen generate --quiet --spec project.remote.yml

      # Simulator builds sign ad hoc and need no team or profile; the README
      # warns against CODE_SIGNING_ALLOWED=NO because an unsigned simulator
      # app has no Keychain, which the store tests rely on.
      # Create a device on the newest iOS runtime the image ships (no runtime
      # download), with the newest plain iPhone device type.
      - name: Create the test simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]; rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")]); print(rs[-1]["identifier"])')
          devtype=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys,re; ds=[d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if re.fullmatch(r"com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-\d+", d["identifier"])]; ds.sort(key=lambda d: int(d.rsplit("-",1)[1])); print(ds[-1])')
          echo "runtime=$runtime devtype=$devtype"
          name="ipu-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sim=$(xcrun simctl create "$name" "$devtype" "$runtime")
          python3 -c 'import sys,uuid; uuid.UUID(sys.argv[1])' "$sim"
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          echo "udid=$sim" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test
        working-directory: apps/ios
        run: |
          set -euo pipefail
          # -quiet keeps the log to warnings, errors and the test summary;
          # pipefail makes the tee report xcodebuild's status.
          xcodebuild -quiet test \
            -project PhoneUseRemoteOnly.xcodeproj \
            -scheme IPhoneUseRemote \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IPhoneUseRemote.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Preserve the test log and result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-app-unit-tests
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/IPhoneUseRemote.xcresult
