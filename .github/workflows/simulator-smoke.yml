name: Simulator smoke

# The simulator preview end to end on a hosted Mac, against real simctl and
# xcodebuild: build the runner for a simulator, start it and a daemon, drive
# the daemon's simulator routes and run an MCP test suite. No phone involved.
# It takes a while (an unsigned runner build and a simulator boot), so it runs
# only when the simulator path changes, or by hand.
on:
  pull_request:
    paths:
      - crates/server/src/simulator.rs
      - crates/server/src/main.rs
      - crates/mcp/src/client.rs
      - runner/**
      - scripts/test-simulator-smoke.sh
      - scripts/test-drag-simulator.py
      - scripts/test-drag-simulator-verdict.py
      - scripts/test-value-read-simulator.py
      - scripts/run-collect-simulator.py
      - scripts/test-collect-simulator.py
      - scripts/test-collect-simulator-verdict.py
      - scripts/fixtures/list-collection/**
      - scripts/test-system-capture-simulator.py
      - scripts/test-system-capture-verifier.py
      - scripts/mcp_probe_peer.py
      - scripts/test-mcp-probe-peer.py
      - scripts/fixtures/system-capture/**
      - scripts/value-read-fixture.swift
      - .github/workflows/simulator-smoke.yml
  workflow_dispatch:
    inputs:
      collect_probe_only:
        description: Verify Native collection against an independent UIKit model on a new Simulator
        type: boolean
        default: false
      tap_identity_guard_probe_only:
        description: Verify frame and literal-target refusals with independent UIKit touch counters
        type: boolean
        default: false
      tap_guard_probe_only:
        description: Verify Native target-frame refusal with independent UIKit touch counters
        type: boolean
        default: false
      wait_probe_only:
        description: Verify Native wait semantics against an independent App on a new Simulator
        type: boolean
        default: false
      selector_probe_only:
        description: Verify literal selectors against an independent App model on a new Simulator
        type: boolean
        default: false
      collect_release_tag:
        description: Published GitHub release whose binaries and runner sources are tested
        type: string
        default: v0.27.21
      prepare_element_ui:
        description: Explicit warm UIKit preparation; false retains the cold-start lane
        type: boolean
        default: false
      element_platform:
        description: Explicit platform for the published Native element oracle; other lanes are unchanged
        type: choice
        default: xcode16.2-ios18.2
        options:
          - xcode16.2-ios18.2
          - xcode16.4-ios18.5
      capture_probe_only:
        description: Verify native system screenshot persistence in an owned Simulator
        type: boolean
        default: false
      capture_mcp:
        description: Verify MCP and privacy refusal through the real daemon and native Photos capture
        type: boolean
        default: false

concurrency:
  group: >-
    simulator-smoke-${{ github.event.pull_request.number
      || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ !inputs.capture_probe_only && !inputs.capture_mcp && !inputs.collect_probe_only && !inputs.selector_probe_only && !inputs.wait_probe_only && !inputs.tap_guard_probe_only && !inputs.tap_identity_guard_probe_only }}
    name: Simulator end to end
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure iOS 18.2 runtime
        timeout-minutes: 15
        run: bash scripts/ensure-simulator-runtime.sh com.apple.CoreSimulator.SimRuntime.iOS-18-2 18.2 "$RUNNER_TEMP/pinned-runtime-18.2"
      - name: Verify Xcode and Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.2'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '18.2'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build iphone-use and iphone-use-mcp
        run: cargo build --release --locked -p server -p iphone-use-mcp

      - name: Xcode and simulators
        id: simulator_target
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          name="ipu-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sim=$(xcrun simctl create "$name" com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-18-2)
          python3 -c 'import sys,uuid; uuid.UUID(sys.argv[1])' "$sim"
          echo "udid=$sim" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        timeout-minutes: 35
        env:
          SIM: ${{ steps.simulator_target.outputs.udid }}
        run: bash scripts/test-simulator-smoke.sh

      - name: Delete only the owned smoke Simulator
        if: ${{ always() && steps.simulator_target.outputs.udid != '' }}
        env:
          OWNED_SIM: ${{ steps.simulator_target.outputs.udid }}
          OWNED_NAME: ${{ steps.simulator_target.outputs.name }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          spec=importlib.util.spec_from_file_location('cleanup', 'scripts/run-collect-simulator.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          out=Path(os.environ['RUNNER_TEMP'])/'smoke-cleanup';out.mkdir(exist_ok=True)
          module.cleanup_owned_simulator(os.environ['OWNED_SIM'],os.environ['OWNED_NAME'],dict(os.environ),out)
          PY

      - name: Candidate selector oracle on iOS 18.2
        timeout-minutes: 15
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          xcodebuild -project runner/IPhoneUseRunner/IPhoneUseRunner.xcodeproj \
            -scheme IPhoneUseRunner -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/selector-runner" \
            -jobs 2 CODE_SIGNING_ALLOWED=NO build-for-testing > "$RUNNER_TEMP/selector-runner-build.log" 2>&1
          recipe=$(python3 -c 'import os; from pathlib import Path; p=list((Path(os.environ["RUNNER_TEMP"])/"selector-runner/Build/Products").glob("*.xctestrun")); assert len(p)==1,p; print(p[0])')
          python3 scripts/run-collect-simulator.py --probe selector \
            --daemon "$GITHUB_WORKSPACE/target/release/iphone-use" \
            --mcp "$GITHUB_WORKSPACE/target/release/iphone-use-mcp" \
            --runner-source "$GITHUB_WORKSPACE/runner" --xctestrun "$recipe" \
            --runtime com.apple.CoreSimulator.SimRuntime.iOS-18-2 \
            --out "$RUNNER_TEMP/candidate-selector-proof"

      - name: Candidate blind selector fixture on iOS 18.2
        timeout-minutes: 15
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          recipe=$(python3 -c 'import os; from pathlib import Path; p=list((Path(os.environ["RUNNER_TEMP"])/"selector-runner/Build/Products").glob("*.xctestrun")); assert len(p)==1,p; print(p[0])')
          python3 scripts/run-collect-simulator.py --probe agent-selector \
            --daemon "$GITHUB_WORKSPACE/target/release/iphone-use" \
            --mcp "$GITHUB_WORKSPACE/target/release/iphone-use-mcp" \
            --runner-source "$GITHUB_WORKSPACE/runner" --xctestrun "$recipe" \
            --runtime com.apple.CoreSimulator.SimRuntime.iOS-18-2 \
            --out "$RUNNER_TEMP/candidate-agent-selector-proof"

      - name: Preserve candidate blind fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-agent-selector-oracle
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/candidate-agent-selector-proof/*.json
            ${{ runner.temp }}/candidate-agent-selector-proof/*.log
            ${{ runner.temp }}/candidate-agent-selector-proof/conformance/*.json
            ${{ runner.temp }}/candidate-agent-selector-proof/conformance/*.log
            ${{ runner.temp }}/candidate-agent-selector-proof/conformance/*.jsonl
            ${{ runner.temp }}/candidate-agent-selector-proof/conformance/*/*.json

      - name: Preserve candidate selector evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-selector-oracle
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/selector-runner-build.log
            ${{ runner.temp }}/candidate-selector-proof/*.json
            ${{ runner.temp }}/candidate-selector-proof/*.log
            ${{ runner.temp }}/candidate-selector-proof/conformance/*.json
            ${{ runner.temp }}/candidate-selector-proof/conformance/*.log
            ${{ runner.temp }}/candidate-selector-proof/conformance/*.jsonl
            ${{ runner.temp }}/candidate-selector-proof/conformance/*/*.json

      - name: Logs
        if: always()
        run: |
          for f in ~/.iphone-use/instances/ci-sim/simulator-runner.log \
                   ~/.iphone-use/instances/ci-sim/simulator-daemon.log; do
            [ -f "$f" ] && { echo "== $f"; tail -120 "$f"; }
          done
          ls -1 ~/.iphone-use/instances/ci-sim/ 2>/dev/null || true

      - name: Preserve independent gesture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulator-gesture-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ~/.iphone-use/instances/ci-sim/value-read/result.json
            ~/.iphone-use/instances/ci-sim/value-read/mcp.log
            ~/.iphone-use/instances/ci-sim/value-read/fixture-build.log
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/**/result.json
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/**/*.png
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/**/flow.log
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/fixture-build.log
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/**/*.xml
            ~/.iphone-use/instances/ci-sim/gesture-acceptance/**/trace.ndjson

  system_capture_probe:
    if: ${{ inputs.capture_probe_only || inputs.capture_mcp }}
    name: System capture / iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.2'
            sdk: '18.2'
            ios: '17.5'
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-17-5
          - xcode: '16.2'
            sdk: '18.2'
            ios: '18.2'
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-18-2
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check stdio pending-request and journal behavior
        run: python3 -I scripts/test-mcp-probe-peer.py
      - if: ${{ inputs.capture_mcp }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - if: ${{ inputs.capture_mcp }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build real daemon and MCP transport
        if: ${{ inputs.capture_mcp }}
        run: |
          set -euo pipefail
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path) CARGO_BUILD_JOBS=2 cargo build --release --locked -p server -p iphone-use-mcp
      - name: Ensure the pinned Simulator runtime
        timeout-minutes: 15
        run: bash scripts/ensure-simulator-runtime.sh '${{ matrix.runtime }}' '${{ matrix.ios }}' "$RUNNER_TEMP/pinned-runtime-${{ matrix.ios }}"
      - name: Build isolated Runner
        run: |
          set -euo pipefail
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '${{ matrix.sdk }}'
          export IPU_RUNNER_DERIVED_DATA="$RUNNER_TEMP/capture-runner"
          bash runner/build.sh --simulator
      - name: Verify one system capture using independent Photos bytes
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xctestrun=$(python3 -c 'import os; from pathlib import Path; p=list((Path(os.environ["RUNNER_TEMP"])/"capture-runner/Build/Products").glob("*.xctestrun")); assert len(p)==1,p; print(p[0])')
          args=(--xctestrun "$xctestrun" --runtime '${{ matrix.runtime }}' --out "$RUNNER_TEMP/system-capture-proof")
          if [ '${{ inputs.capture_mcp }}' = 'true' ]; then
            args+=(--daemon target/release/iphone-use --mcp target/release/iphone-use-mcp --finish-preview)
          fi
          python3 scripts/test-system-capture-simulator.py "${args[@]}"
      - name: Preserve capture dispatch and independent Photos receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: system-capture-ios-${{ matrix.ios }}
          path: |
            ${{ runner.temp }}/system-capture-proof/*.json
            ${{ runner.temp }}/system-capture-proof/*.jsonl
            ${{ runner.temp }}/system-capture-proof/capture-photo-original.bin
            ${{ runner.temp }}/system-capture-proof/failure-ui.png
            ${{ runner.temp }}/system-capture-proof/xcode.log
            ${{ runner.temp }}/system-capture-proof/daemon.log
            ${{ runner.temp }}/system-capture-proof/mcp.log
            ${{ runner.temp }}/build-simulator.log

  list_collection_probe:
    if: ${{ inputs.collect_probe_only || inputs.selector_probe_only || inputs.wait_probe_only || inputs.tap_guard_probe_only || inputs.tap_identity_guard_probe_only }}
    name: Native element oracle / released artifact
    runs-on: macos-15
    permissions:
      # Draft assets require push access. This job only runs for explicit
      # workflow_dispatch probe inputs, never the untrusted pull_request path.
      contents: write
      actions: read
    timeout-minutes: 105
    env:
      DEVELOPER_DIR: ${{ inputs.element_platform == 'xcode16.4-ios18.5' && '/Applications/Xcode_16.4.app/Contents/Developer' || '/Applications/Xcode_16.2.app/Contents/Developer' }}
      ELEMENT_RUNTIME: ${{ inputs.element_platform == 'xcode16.4-ios18.5' && 'com.apple.CoreSimulator.SimRuntime.iOS-18-5' || 'com.apple.CoreSimulator.SimRuntime.iOS-18-2' }}
      ELEMENT_IOS: ${{ inputs.element_platform == 'xcode16.4-ios18.5' && '18.5' || '18.2' }}
      IPU_DIAGNOSTIC_PLATFORM: ${{ inputs.element_platform }}
      PREPARE_ELEMENT_UI: ${{ inputs.prepare_element_ui }}
      LIST_RELEASE: ${{ inputs.collect_release_tag }}
      ELEMENT_PROBE: ${{ inputs.tap_identity_guard_probe_only && 'tap-identity-guard' || inputs.tap_guard_probe_only && 'tap-guard' || inputs.wait_probe_only && 'wait' || inputs.selector_probe_only && 'selector' || 'list' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reject conflicting probe modes
        if: ${{ (inputs.tap_identity_guard_probe_only && (inputs.collect_probe_only || inputs.selector_probe_only || inputs.wait_probe_only || inputs.tap_guard_probe_only)) || (inputs.tap_guard_probe_only && (inputs.collect_probe_only || inputs.selector_probe_only || inputs.wait_probe_only)) || (inputs.collect_probe_only && inputs.selector_probe_only) || (inputs.wait_probe_only && (inputs.collect_probe_only || inputs.selector_probe_only)) }}
        run: |
          echo "Choose exactly one of collect_probe_only, selector_probe_only, wait_probe_only, tap_guard_probe_only or tap_identity_guard_probe_only" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the published version before selecting its test recipes
        shell: bash
        run: |
          [[ "$LIST_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IPU_DIAGNOSTIC_PLATFORM" == xcode16.2-ios18.2 || "$IPU_DIAGNOSTIC_PLATFORM" == xcode16.4-ios18.5 ]]
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "$ELEMENT_IOS"
      - name: Checkout the exact published version's oracle and fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.LIST_RELEASE }}
          path: .release-oracle
          persist-credentials: false
      - name: Record product and oracle provenance separately from workflow infrastructure
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          tag=os.environ['LIST_RELEASE']
          sha=subprocess.check_output(['git','-C','.release-oracle','rev-parse','HEAD'],text=True).strip()
          tagged=subprocess.check_output(['git','-C','.release-oracle','rev-parse',f'refs/tags/{tag}^{{commit}}'],text=True).strip()
          assert sha==tagged,'oracle HEAD must be the selected tag commit'
          endpoint=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/release-binaries.yml/runs?branch={tag}&status=success&event=push&per_page=100"
          runs=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))['workflow_runs']
          builds=[r for r in runs if r['head_sha']==sha and r['head_branch']==tag and r['event']=='push' and r['conclusion']=='success']
          assert builds,'selected oracle must match a successful tag release build'
          build=max(builds,key=lambda r:r['id'])
          proof={'release_tag':tag,'oracle_commit':sha,'verification_workflow_sha':os.environ['WORKFLOW_SHA'],'warm_ui_requested':os.environ['PREPARE_ELEMENT_UI']=='true','release_build_run':build['id'],'release_build_url':build['html_url'],'scope':'source identity bound to successful release build metadata; not reproducible-build attestation'}
          (Path(os.environ['RUNNER_TEMP'])/'list-oracle-source.json').write_text(json.dumps(proof,indent=2)+'\n')
          PYCODE
      - name: Ensure explicitly selected element-test runtime
        timeout-minutes: 15
        run: bash scripts/ensure-simulator-runtime.sh "$ELEMENT_RUNTIME" "$ELEMENT_IOS" "$RUNNER_TEMP/pinned-runtime-$ELEMENT_IOS"
      - name: Negative controls for the model oracle
        run: python3 -I .release-oracle/scripts/test-collect-simulator-verdict.py
      - name: Selector oracle negative controls
        run: python3 -I .release-oracle/scripts/test-selector-simulator-verdict.py
      - name: Download and check the exact published product
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LIST_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/list-release"
          gh release download "$LIST_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/list-release" \
            --pattern iPhoneUse.app.zip --pattern iPhoneUse.app.zip.sha256 \
            --pattern iphone-use-runner.tar.gz --pattern iphone-use-runner.tar.gz.sha256
          cd "$RUNNER_TEMP/list-release"
          shasum -a 256 -c iPhoneUse.app.zip.sha256
          shasum -a 256 -c iphone-use-runner.tar.gz.sha256
          ditto -x -k iPhoneUse.app.zip .
          python3 -c 'import tarfile; t=tarfile.open("iphone-use-runner.tar.gz"); t.extractall(".",filter="data")'
          codesign --verify --deep --strict iPhoneUse.app
          python3 "$GITHUB_WORKSPACE/scripts/validate-stapled-artifact.py" iPhoneUse.app
          test "$(./iPhoneUse.app/Contents/MacOS/iphone-use --version)" = "iphone-use ${LIST_RELEASE#v}"
          python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'list-oracle-source.json'
          proof=json.loads(path.read_text())
          proof['downloaded_payload_sha256']={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['iPhoneUse.app.zip','iphone-use-runner.tar.gz']}
          path.write_text(json.dumps(proof,indent=2)+'\n')
          PYCODE
      - name: Build the published Native runner separately from startup
        run: |
          xcodebuild -project "$RUNNER_TEMP/list-release/runner/IPhoneUseRunner/IPhoneUseRunner.xcodeproj" \
            -scheme IPhoneUseRunner -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/list-runner" \
            -jobs 2 CODE_SIGNING_ALLOWED=NO build-for-testing > "$RUNNER_TEMP/list-runner-build.log" 2>&1
      - name: Run the version-pinned Native oracle in the selected startup context
        timeout-minutes: 75
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/list-oracle-source.json"
          oracle_sha=$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"list-oracle-source.json").read_text())["oracle_commit"])')
          oracle_args=(--oracle-root "$GITHUB_WORKSPACE/.release-oracle" --oracle-commit "$oracle_sha")
          if [ "$PREPARE_ELEMENT_UI" = true ]; then oracle_args+=(--prepare-ui); fi
          recipe=$(python3 -c 'import os; from pathlib import Path; p=list((Path(os.environ["RUNNER_TEMP"])/"list-runner/Build/Products").glob("*.xctestrun")); assert len(p)==1,p; print(p[0])')
          python3 scripts/run-collect-simulator.py \
            --probe "$ELEMENT_PROBE" \
            --daemon "$RUNNER_TEMP/list-release/iPhoneUse.app/Contents/MacOS/iphone-use" \
            --mcp "$RUNNER_TEMP/list-release/iPhoneUse.app/Contents/MacOS/iphone-use-mcp" \
            --runner-source "$RUNNER_TEMP/list-release/runner" \
            --xctestrun "$recipe" \
            "${oracle_args[@]}" \
            --runtime "$ELEMENT_RUNTIME" \
            --out "$RUNNER_TEMP/list-oracle-proof"
      - name: Preserve independent models, Native results and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-list-oracle
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/list-oracle-source.json
            ${{ runner.temp }}/list-runner-build.log
            ${{ runner.temp }}/list-oracle-proof/*.json
            ${{ runner.temp }}/list-oracle-proof/*.log
            ${{ runner.temp }}/list-oracle-proof/platform-warmup/*.json
            ${{ runner.temp }}/list-oracle-proof/platform-warmup/*.log
            ${{ runner.temp }}/list-oracle-proof/platform-warmup/ordinary-app-build/fixture-build.log
            ${{ runner.temp }}/list-oracle-proof/conformance/*.json
            ${{ runner.temp }}/list-oracle-proof/conformance/*.log
            ${{ runner.temp }}/list-oracle-proof/conformance/*.jsonl
            ${{ runner.temp }}/list-oracle-proof/conformance/failure-ui.png
            ${{ runner.temp }}/list-oracle-proof/conformance/*/*.json
            ${{ runner.temp }}/list-oracle-proof/default-conformance/*.json
            ${{ runner.temp }}/list-oracle-proof/default-conformance/*.log
            ${{ runner.temp }}/list-oracle-proof/default-conformance/*.jsonl
            ${{ runner.temp }}/list-oracle-proof/default-conformance/failure-ui.png
            ${{ runner.temp }}/list-oracle-proof/default-conformance/*/*.json
