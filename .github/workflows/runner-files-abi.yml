name: Runner private control ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'runner/**'
      - 'scripts/build-ios-embed.sh'
      - 'scripts/test-runner-daemon-control.py'
      - '.github/workflows/runner-files-abi.yml'

permissions:
  contents: read

concurrency:
  group: runner-files-abi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-role-abi:
    name: Build and link private Runner daemon ABI
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      IPHONE_USE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: runner-private-control-ios
      - name: Build the real iOS static library and retain both C entry points
        shell: bash
        run: |
          set -euo pipefail
          lib="$(bash scripts/build-ios-embed.sh | tail -1)"
          test -f "$lib"
          git diff --exit-code Cargo.lock
          nm -gU "$lib" > "$RUNNER_TEMP/private-role-library-symbols.txt"
          grep -q '_ipu_daemon_start$' "$RUNNER_TEMP/private-role-library-symbols.txt"
          grep -q '_ipu_daemon_start_runner$' "$RUNNER_TEMP/private-role-library-symbols.txt"
          IPU_EMBED_LIB="$lib" IPU_RUNNER_DERIVED_DATA="$RUNNER_TEMP/private-role-runner/DerivedData" \
            bash runner/build.sh --unsigned
          bundle="$RUNNER_TEMP/private-role-runner/DerivedData/Build/Products/Debug-iphoneos/iPhoneUse-Runner.app/PlugIns/iPhoneUse.xctest"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
          [[ -n "$executable" && "$executable" != */* ]]
          binary="$bundle/$executable"
          test -f "$binary"
          nm -gU "$binary" > "$RUNNER_TEMP/private-role-linked-symbols.txt"
          grep -q '_ipu_daemon_start$' "$RUNNER_TEMP/private-role-linked-symbols.txt"
          grep -q '_ipu_daemon_start_runner$' "$RUNNER_TEMP/private-role-linked-symbols.txt"
          shasum -a 256 "$lib" "$binary"
      - name: Preserve symbol receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runner-private-control-symbols
          path: |
            ${{ runner.temp }}/private-role-library-symbols.txt
            ${{ runner.temp }}/private-role-linked-symbols.txt
            ${{ runner.temp }}/private-role-runner/build-unsigned.log
