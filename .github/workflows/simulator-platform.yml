name: Simulator platform premise diagnostic
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Compare the pinned lane with the hosted image's supported default
        type: choice
        default: xcode16.2-ios18.2
        options:
          - xcode16.2-ios18.2
          - xcode16.4-ios18.5
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: ${{ inputs.platform == 'xcode16.4-ios18.5' && '/Applications/Xcode_16.4.app/Contents/Developer' || '/Applications/Xcode_16.2.app/Contents/Developer' }}
      IPU_DIAGNOSTIC_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test runtime and direct XCTest startup independently of product CLI
        run: python3 scripts/diagnose-simulator-platform.py
      - name: Preserve the actual diagnostic and cleanup verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: simulator-platform-diagnostic
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/simulator-platform-diagnostic/result.json
            ${{ runner.temp }}/simulator-platform-diagnostic/*.log
            ${{ runner.temp }}/simulator-platform-diagnostic/*.sample
            ${{ runner.temp }}/simulator-platform-diagnostic/*observations.json
            ${{ runner.temp }}/simulator-platform-diagnostic/ordinary-app-state.json
            ${{ runner.temp }}/simulator-platform-diagnostic/ordinary-app-build/fixture-build.log
