name: IPhoneUseRemote
options:
  bundleIdPrefix: com.leeguoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 6ZPXG4KVVS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  IPhoneUseRemote:
    type: application
    platform: iOS
    sources:
      - IPhoneUseRemote/Sources
      - IPhoneUseRemote/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.iphone-use.remote
        PRODUCT_NAME: iPhone Use
        INFOPLIST_FILE: IPhoneUseRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
